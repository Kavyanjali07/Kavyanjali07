<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Software engineering and cybersecurity architecture</title>
<desc id="desc">A dark technical architecture diagram showing interface, application services, data layer, and security controls connected by signal-red lines.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#29303a" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a22"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#fade)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)" opacity=".72"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <text x="44" y="48" fill="#f1f3f5" font-size="15" letter-spacing="3">ENGINEERING SYSTEM MAP</text>
  <text x="1155" y="48" fill="#ff5252" font-size="12" text-anchor="end">HYBRID / 01</text>
  <path d="M62 86H1138" stroke="#39414c" stroke-width="1"/>
  <g fill="#111720" stroke="#4b5665" stroke-width="1.2">
    <rect x="52" y="126" width="230" height="132" rx="10"/>
    <rect x="354" y="126" width="230" height="132" rx="10"/>
    <rect x="656" y="126" width="230" height="132" rx="10"/>
    <rect x="958" y="126" width="190" height="132" rx="10"/>
  </g>
  <g fill="#ff5252" filter="url(#glow)">
    <circle cx="74" cy="148" r="4"/><circle cx="376" cy="148" r="4"/><circle cx="678" cy="148" r="4"/><circle cx="980" cy="148" r="4"/>
  </g>
  <g fill="#f4f5f7" font-size="18" font-weight="700">
    <text x="74" y="183">INTERFACE</text><text x="376" y="183">APPLICATION</text><text x="678" y="183">DATA LAYER</text><text x="980" y="183">SECURITY</text>
  </g>
  <g fill="#aeb8c5" font-size="12">
    <text x="74" y="210">React / Next.js</text><text x="74" y="230">TypeScript / UX</text>
    <text x="376" y="210">Java / Spring Boot</text><text x="376" y="230">REST / service logic</text>
    <text x="678" y="210">PostgreSQL / SQL</text><text x="678" y="230">Models / persistence</text>
    <text x="980" y="210">Identity / access</text><text x="980" y="230">Linux / network controls</text>
  </g>
  <g fill="none" stroke="#ff5252" stroke-width="2">
    <path d="M282 192H354"/><path d="M584 192H656"/><path d="M886 192H958"/>
  </g>
  <g fill="#ff5252"><path d="M346 186l8 6-8 6z"/><path d="M648 186l8 6-8 6z"/><path d="M950 186l8 6-8 6z"/></g>
  <path d="M1070 258V294H468V258" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="5 6" opacity=".9"/>
  <text x="770" y="316" fill="#ff7777" font-size="11" text-anchor="middle" letter-spacing="2">TRUST BOUNDARIES · VALIDATION · OBSERVABILITY</text>
  <text x="52" y="316" fill="#758191" font-size="11">DESIGN → BUILD → INSPECT → TEST</text>
</g>
</svg>